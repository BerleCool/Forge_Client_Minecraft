name: Build Forge Client 1.8.9

on:
  workflow_dispatch:
  push:
    branches: [feat/forge-client-foundation]
    paths-ignore: ['dist/**']

permissions:
  contents: write
  statuses: write

concurrency:
  group: forge-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and remap JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Materialize audited 0.4 source pass
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'feat: open-source-audited modules and Forge Quickplay 0.4 [skip ci]'
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Install Java 8 compiler/runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Compile, run Java 8 suites and remap
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean check remapJar --stacktrace 2>&1 | tee build.log

      - name: Verify and stage distributable
        shell: bash
        run: |
          set -euo pipefail
          source_jar='build/libs/forge-client-0.4.0-alpha.jar'
          output_jar='dist/Forge-Client-1.8.9-0.4.0-alpha.jar'
          mkdir -p dist
          rm -f dist/Forge-Client-1.8.9-0.3.0-alpha.jar dist/Forge-Client-1.8.9-0.3.0-alpha.jar.sha256
          python3 scripts/verify_jar.py "$source_jar" > dist/jar-verification.json
          cp "$source_jar" "$output_jar"
          sha256sum "$output_jar" > "$output_jar.sha256"
          cp build/reports/core-tests.json dist/core-tests.json
          python3 - <<'PY'
          import json, os, pathlib
          report=json.loads(pathlib.Path('dist/jar-verification.json').read_text())
          tests=json.loads(pathlib.Path('dist/core-tests.json').read_text())
          assert tests['groupsFailed']==0 and tests['groupsPassed']>=40
          assert tests['java'].startswith('1.8.'), 'Tests did not run on Java 8'
          assert report['live_modules']==89 and report['placeholder_modules']==0
          receipt=dict(
              source_commit=os.environ['SOURCE_COMMIT'],source_tree=os.environ['SOURCE_TREE'],
              workflow_run='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              minecraft='1.8.9',forge='11.15.1.2318',version='0.4.0-alpha',java_major=report['java_major'],
              test_runtime=tests['java'],test_groups=tests['groupsPassed'],assertions=tests['assertions'],
              live_modules=report['live_modules'],placeholder_modules=report['placeholder_modules'],
              implementation_audit_modules=89,quickplay_destinations=19,
              jar_sha256=report['sha256'],jar_bytes=report['bytes'],optifine_bundled=False,
              in_game_qa=False,performance_benchmarked=False)
          pathlib.Path('dist/build-info.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          cat dist/jar-verification.json

      - name: Upload compiled mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Client-1.8.9-0.4.0-alpha
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish tested source and JAR to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A dist
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish Java 8 verified Forge Client 0.4 alpha [skip ci]'
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Link publication commit to successful verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context='Forge Client / verified JAR' \
            -f description='0.4 compile, Java 8 tests, OSS audit, remap and JAR checks passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-diagnostics-${{ github.run_id }}
          path: |
            build.log
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
